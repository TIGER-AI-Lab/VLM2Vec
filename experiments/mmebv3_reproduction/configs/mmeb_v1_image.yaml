# MMEB-V1 / MMEB-V2 image suite (36 tasks).
# Identical to experiments/public/eval/image.yaml minus MCMR (a V3-only dataset).
#
# Run with DATA_BASEDIR=<MMEB-V2-eval root>, whose image-tasks/<ds>/ holds the
# ziyjiang/MMEB_Test_Instruct parquets (columns qry_text + qry_inst) and whose
# image-tasks/MMEB/ is the shared image store.
#
# Both releases carry the same instruction text; they differ in how it is stored.
# V3 inlines it in qry_text; the instruct release puts it in qry_inst. The parser
# strips `<|image_1|>` from qry_inst but not from qry_text, so the V3 path leaves
# a literal `<|image_1|>` and a doubled space in every image query:
#   V3      '<|image_pad|>  <|image_1|>\nIdentify the scene shown in the image\n\n'
#   instruct '<|image_pad|>\nIdentify the scene shown in the image\n'
# This config exists to measure how much of the v1/v2-vs-v3 image gap that accounts for.
ImageNet-1K:
  dataset_parser: image_cls
  dataset_name: ImageNet-1K
  dataset_split: test
  image_root: image-tasks/MMEB/
  eval_type: local
